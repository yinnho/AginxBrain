name: Release

# Build desktop installers for macOS (arm64 + x86_64) and Windows whenever a
# version tag (v*) is pushed, then attach them to a GitHub Release.
#
# Usage:
#   git tag v0.x.x
#   git push origin v0.x.x
#
# We build with the plain `tauri build` CLI and upload artifacts ourselves
# (softprops/action-gh-release) rather than tauri-action's uploader, which
# errors with "No artifacts were found" when the updater isn't signed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web-client/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Build desktop client frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web-client

      # Release desktop builds embed web/dist (admin dashboard) via rust_embed
      # — the desktop app runs the full gateway and serves its admin UI.
      - name: Build admin dashboard frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build app bundle
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo tauri build --target ${{ matrix.target }}
          else
            cargo tauri build
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            AginxBrain desktop client. Download the installer for your platform below.

            - **macOS Apple Silicon**: `*_aarch64.dmg`
            - **macOS Intel**: `*_x64.dmg`
            - **Windows**: `*_x64-setup.exe` / `*_x64_en-US.msi`

            Usage: the app now runs the full gateway locally (manage it at `http://127.0.0.1:8083/` — create the admin account on first launch, then add providers/routes in the dashboard). Or keep using a remote server: enter your brain.aginx.net API key. Set `host: 0.0.0.0` in `~/.aginxbrain/config.yaml` and restart to share the gateway on the LAN — the app shows ready-to-copy onboarding snippets for colleagues.

            **v0.5.0 changes**

            桌面版从「瘦客户端」升级为「本地网关 + 瘦客户端」双模式：

            - 桌面 App 启动即内嵌完整网关（默认 `127.0.0.1:8083`，托盘可打开管理台）；远程模式（brain.aginx.net + key）照旧可用
            - Provider 级出站代理：每个 provider 可单独设 `proxy`（http/https），例如 OpenAI 走本地美国出口、其余国内 provider 直连
            - `host: 0.0.0.0` 局域网共享：同事的 Claude Code / Codex 接入配置在 App 内一键复制
            - fix: Codex 接管不再写 `preferred_auth_method` / `disable_response_storage`（新版 Codex 已废弃并启动告警）；已有配置删掉这两行即可

            > macOS 未签名：dmg 打开后若提示「已损坏」，运行 `xattr -cr /Applications/AginxBrain.app` 后再启动。
          files: release-assets/*
